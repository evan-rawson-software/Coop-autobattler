name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_RELAXED_TIMING: '1'

# The checks run as parallel jobs; `check` at the end passes only when all of
# them pass, so it stays the one status to look at.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm validate:content

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each package's test files are split in two; a shard with no files in
      # a package passes (--passWithNoTests).
      - run: pnpm -r run test --shard=${{ matrix.shard }}/2

  # The smoke script is split in two parts that run in parallel (SMOKE_PART):
  # `main` (page, camera, performance, build and battle checks) and `flows`
  # (worker, shop, sprites, art, run and tutorial).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [main, flows]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: playwright
        run: echo "version=$(pnpm --filter @game/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @game/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @game/web exec playwright install-deps chromium
      - run: pnpm smoke
        timeout-minutes: 12
        env:
          SMOKE_PART: ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: failure()
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: smoke-output-${{ matrix.part }}
          path: packages/web/smoke-output/*.png
          if-no-files-found: ignore
          retention-days: 3
      # The goldens do not depend on the part, so one of them checks them.
      - name: Golden files are up to date
        if: matrix.part == 'main'
        run: |
          pnpm golden:update
          git status --porcelain
          test -z "$(git status --porcelain)"

  check:
    needs: [static, test, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All checks passed
        run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.smoke.result }}" = success

  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scripted bot plays short runs of every strategy through the
      # session intents. Fails on a rejected intent, a crash, or a run that
      # differs when played again with the same seed.
      - run: pnpm sim bot --strategy all --count 3 --max-rounds 4 --verify
      - run: pnpm sim bot --strategy all --count 2 --party 3 --max-rounds 3 --verify
