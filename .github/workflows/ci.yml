name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_RELAXED_TIMING: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:content
      - id: playwright
        run: echo "version=$(pnpm --filter @game/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @game/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @game/web exec playwright install-deps chromium
      - run: pnpm smoke
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: failure()
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: smoke-output
          path: packages/web/smoke-output/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Golden files are up to date
        run: |
          pnpm golden:update
          git status --porcelain
          test -z "$(git status --porcelain)"
